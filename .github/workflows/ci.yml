name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release

      # Mode VPN memuat wintun.dll dari folder yang sama dengan executable.
      - name: Bundle Wintun DLL
        run: copy assets\wintun.dll target\release\wintun.dll

      - uses: actions/upload-artifact@v4
        with:
          name: mydns-windows
          path: |
            target/release/mydns.exe
            target/release/wintun.dll

  # Versi minimum di Cargo.toml harus benar-benar bisa membangun proyek.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check
        run: cargo check --all-targets

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, audit]
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mydns-windows
          path: bundle

      - name: Verify bundled files
        shell: pwsh
        run: |
          foreach ($file in 'mydns.exe', 'wintun.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path 'bundle' $file))) {
              throw "$file tidak ada di artefak mydns-windows; rilis dibatalkan"
            }
          }

      - name: Bundle ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path bundle/mydns.exe,bundle/wintun.dll -DestinationPath mydns-x86_64-pc-windows-msvc.zip
          $hash = (Get-FileHash -Algorithm SHA256 mydns-x86_64-pc-windows-msvc.zip).Hash.ToLowerInvariant()
          Set-Content -Path SHA256SUMS -Value "$hash  mydns-x86_64-pc-windows-msvc.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" mydns-x86_64-pc-windows-msvc.zip SHA256SUMS install.ps1 --title "MyDNS ${{ github.ref_name }}" --generate-notes

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
