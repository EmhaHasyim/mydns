[package]
name = "mydns"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Pengalih DNS Windows 11 ke DoQ/DoH3 lewat proxy loopback, dengan TUI dan pemulihan otomatis"
repository = "https://github.com/EmhaHasyim/mydns"
readme = "README.md"

[dependencies]
bytes = "1.12.1"
h2 = "0.4.13"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-proto = "0.26.3"
http = "1.5.0"
quinn = "0.11.12"
ratatui = "0.30.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
    "signal",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.12"
zeroize = "1.9.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wintun = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
